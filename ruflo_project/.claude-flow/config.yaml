# RuFlo V3 Runtime Configuration
# Generated: 2026-05-17T04:57:00.212Z

version: "3.0.0"

swarm:
  topology: hierarchical-mesh
  maxAgents: 8
  autoScale: true
  coordinationStrategy: specialized

memory:
  backend: sqljs
  enableHNSW: true
  persistPath: .claude-flow/data
  cacheSize: 1000
  # ADR-049: Self-Learning Memory
  learningBridge:
    enabled: true
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: true
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: true
    defaultScope: project

neural:
  enabled: true
  modelPath: .claude-flow/neural

hooks:
  enabled: true
  autoExecute: true

mcp:
  autoStart: true
  port: 3010
